# ClusterSecretStore — AWS Secrets Manager
#
# ESO's connector to AWS Secrets Manager. One cluster-wide store rather than
# per-namespace: fewer moving parts, and the IRSA role is already scoped to
# `arn:aws:secretsmanager:*:*:secret:baseline/*` so blast radius is already
# contained.
#
# The service account `external-secrets/external-secrets` is annotated with
# the IRSA role ARN out of the Terraform output.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
