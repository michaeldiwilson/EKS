# ExternalSecret — one secret projected into the cluster
#
# Pulls `baseline/sample-app` from AWS Secrets Manager and materialises it as
# a Kubernetes Secret named `sample-app-env` in the `default` namespace. The
# sample app Deployment consumes it as env vars.
#
# refreshInterval controls how often ESO re-reads the backend. One hour is
# a sensible default: short enough that rotations propagate within an SLA,
# long enough to not hammer Secrets Manager. The pod itself still needs
# re-rolling to pick up the new values — Reloader is one of the next
# add-ons I'd put in the same cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sample-app
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: sample-app-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: baseline/sample-app
